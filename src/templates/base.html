<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login API{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        .main-content { flex: 1; }
        footer { background: #212529; color: #ced4da; padding: 2rem 0; margin-top: 3rem; }
        .navbar-brand { font-weight: 800; letter-spacing: -0.5px; }
        .card { border-radius: 15px; border: none; }
        footer {
            background: white;
            border-top: 1px solid #eee;
            color: #6c757d;
            padding: 40px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand text-success" href="/"><i class="bi bi-code-slash me-2"></i>LOGIN API</a>
        <button class="btn btn-success btn-sm fw-bold rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#createModal">
            <i class="bi bi-plus-lg me-1"></i> Novo Usuário
        </button>
    </div>
</nav>

<main class="container main-content mt-4">
    {% block content %}{% endblock %}
</main>

<footer>
    <div class="container text-center">
        <div class="row">
            <div class="col-md-6 text-md-start small">
                © 2026 Login API System. Desenvolvido com FastAPI & Clean Architecture.
            </div>
            <div class="col-md-6 text-md-end">
                <a href="#" class="text-decoration-none text-muted me-3"><i class="bi bi-github"></i></a>
                <a href="#" class="text-decoration-none text-muted"><i class="bi bi-linkedin"></i></a>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
